default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgresql://landchecker:landchecker@localhost:5432/landchecker_development") %>
test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL", "postgresql://landchecker:landchecker@db:5432/landchecker_test") %>
production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>

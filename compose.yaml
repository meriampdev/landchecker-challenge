services:
  db:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_USER: landchecker
      POSTGRES_PASSWORD: landchecker
      POSTGRES_DB: landchecker_development
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U landchecker -d landchecker_development"]
      interval: 3s
      timeout: 3s
      retries: 30
  backend:
    build: ./backend
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgresql://landchecker:landchecker@db:5432/landchecker_development
      SECRET_KEY_BASE: local-demo-only-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    volumes:
      - ./backend:/app
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    volumes:
      - ./frontend:/app
      # Seeded from the image; host node_modules must never mask Linux dependencies.
      - /app/node_modules
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [backend]
volumes:
  pgdata:
